patch:
  show_notifications: false
  style/ascii_tip_follow_cursor: false
  style/horizontal: true
  style/font_face: "Microsoft YaHei UI"
  style/font_point: 15
  style/inline_preedit: true
  style/label_font_face: "Segoe UI"
  style/label_font_point: 10
  style/comment_font_face: "Microsoft YaHei UI"
  style/comment_font_point: 11
  style/label_format: "%s"
  style/hover_type: semi_light
  style/layout/border_width: 1
  style/layout/margin_x: 12
  style/layout/margin_y: 8
  style/layout/candidate_spacing: 12
  style/layout/hilite_spacing: 4
  style/layout/hilite_padding: 7
  style/layout/round_corner: 11
  style/layout/corner_radius: 16
  style/layout/shadow_radius: 4
  style/layout/shadow_offset_x: 0
  style/layout/shadow_offset_y: 2
  style/color_scheme: shuangpin_link
  style/color_scheme_dark: shuangpin_link_dark
  # 原生候选窗以 BGR 表示颜色，阴影只绘制在轮廓外。
  preset_color_schemes/shuangpin_link:
    name: 双拼互联 浅色玻璃
    back_color: 0xfff7ed
    border_color: 0xf6e7cf
    shadow_color: 0x21604b24
    text_color: 0x483016
    hilited_text_color: 0x613c13
    hilited_back_color: 0xfff0d6
    candidate_text_color: 0x483016
    comment_text_color: 0x79644b
    label_color: 0x79644b
    hilited_candidate_back_color: 0xfff0d6
    hilited_candidate_text_color: 0x613c13
    hilited_comment_text_color: 0x735836
    hilited_candidate_label_color: 0x8d6029
  preset_color_schemes/shuangpin_link_dark:
    name: 双拼互联 深色玻璃
    back_color: 0x26180c
    border_color: 0x755834
    shadow_color: 0x46000000
    text_color: 0xfff7ea
    hilited_text_color: 0xfff7ea
    hilited_back_color: 0x63451e
    candidate_text_color: 0xfff7ea
    comment_text_color: 0xdac6aa
    label_color: 0xdac6aa
    hilited_candidate_back_color: 0x63451e
    hilited_candidate_text_color: 0xfff7ea
    hilited_comment_text_color: 0xeedebc
    hilited_candidate_label_color: 0xffcf82

