patch:
  style/horizontal: true
  style/font_face: "Microsoft YaHei UI"
  style/font_point: 15
  style/inline_preedit: true
  style/label_font_face: "Segoe UI"
  style/label_font_point: 10
  style/comment_font_face: "Microsoft YaHei UI"
  style/comment_font_point: 11
  style/label_format: "%s"
  style/hover_type: semi_light
  style/layout/border_width: 1
  style/layout/margin_x: 12
  style/layout/margin_y: 8
  style/layout/candidate_spacing: 12
  style/layout/hilite_spacing: 4
  style/layout/hilite_padding: 7
  style/layout/round_corner: 11
  style/layout/corner_radius: 16
  style/layout/shadow_radius: 4
  style/layout/shadow_offset_x: 0
  style/layout/shadow_offset_y: 2
  style/color_scheme: shuangpin_link
  style/color_scheme_dark: shuangpin_link_dark
  # 小狼毫用 BGR 表示颜色。窗口底色保持不透明，只在轮廓外绘制淡阴影。
  preset_color_schemes/shuangpin_link:
    name: 双拼互联 浅紫
    back_color: 0xfbf1f4
    border_color: 0xf2d4df
    shadow_color: 0x21443a5c
    text_color: 0x321b20
    hilited_text_color: 0x5e2d43
    hilited_back_color: 0xffdee7
    candidate_text_color: 0x321b20
    comment_text_color: 0x775c64
    label_color: 0x775c64
    hilited_candidate_back_color: 0xffdee7
    hilited_candidate_text_color: 0x5e2d43
    hilited_comment_text_color: 0x795967
    hilited_candidate_label_color: 0x936049
  preset_color_schemes/shuangpin_link_dark:
    name: 双拼互联 深紫
    back_color: 0x1e1211
    border_color: 0x664450
    shadow_color: 0x46000000
    text_color: 0xfff1f6
    hilited_text_color: 0xffe7f4
    hilited_back_color: 0x4f3035
    candidate_text_color: 0xfff1f6
    comment_text_color: 0xcbb2b8
    label_color: 0xcbb2b8
    hilited_candidate_back_color: 0x4f3035
    hilited_candidate_text_color: 0xfff1f6
    hilited_comment_text_color: 0xdfc8d6
    hilited_candidate_label_color: 0xffa4b8

