patch:
  style/horizontal: true
  style/font_face: "Microsoft YaHei UI"
  style/font_point: 15
  style/inline_preedit: true
  style/label_font_face: "Segoe UI"
  style/label_font_point: 10
  style/comment_font_face: "Microsoft YaHei UI"
  style/comment_font_point: 11
  style/label_format: "%s"
  style/hover_type: semi_light
  style/layout/border_width: 1
  style/layout/margin_x: 12
  style/layout/margin_y: 8
  style/layout/candidate_spacing: 12
  style/layout/hilite_spacing: 4
  style/layout/hilite_padding: 6
  style/layout/round_corner: 8
  style/layout/corner_radius: 12
  style/layout/shadow_radius: 6
  style/layout/shadow_offset_x: 0
  style/layout/shadow_offset_y: 2
  style/color_scheme: shuangpin_link
  style/color_scheme_dark: shuangpin_link_dark
  # 小狼毫颜色使用 BGR 顺序，四字节颜色的最高位是透明度。
  preset_color_schemes/shuangpin_link:
    name: 双拼互联亮色
    back_color: 0xffffff
    border_color: 0xe6e1d6
    shadow_color: 0x262b2317
    text_color: 0x2b2317
    hilited_text_color: 0x515607
    hilited_back_color: 0xf0f3e1
    candidate_text_color: 0x2b2317
    comment_text_color: 0x756a58
    label_color: 0x756a58
    hilited_candidate_back_color: 0xf0f3e1
    hilited_candidate_text_color: 0x515607
    hilited_comment_text_color: 0x687044
    hilited_candidate_label_color: 0x787f00
  preset_color_schemes/shuangpin_link_dark:
    name: 双拼互联暗色
    back_color: 0x282218
    border_color: 0x504636
    shadow_color: 0x5a000000
    text_color: 0xf0eeea
    hilited_text_color: 0xcee479
    hilited_back_color: 0x3b3e19
    candidate_text_color: 0xf0eeea
    comment_text_color: 0xbeb3a2
    label_color: 0xbeb3a2
    hilited_candidate_back_color: 0x3b3e19
    hilited_candidate_text_color: 0xcee479
    hilited_comment_text_color: 0xb4ca8f
    hilited_candidate_label_color: 0xcee479

