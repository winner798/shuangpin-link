config_version: "3"
name: 双拼互联

style:
  candidate_text_size: 20
  candidate_padding: 12
  candidate_spacing: 0
  candidate_view_height: 45
  candidate_corner_radius: 11
  comment_height: 12
  comment_position: right
  comment_text_size: 10
  horizontal_gap: 6
  vertical_gap: 10
  keyboard_padding: 2
  keyboard_padding_bottom: 6
  keyboard_padding_land: 44
  keyboard_padding_land_bottom: 4
  keyboard_height: 250
  keyboard_height_land: 168
  key_height: 54
  key_text_size: 24
  key_long_text_size: 14
  label_text_size: 14
  symbol_text_size: 10
  key_border: 1
  round_corner: 10
  enter_label_mode: 2
  enter_labels:
    go: 前往
    done: 完成
    next: 下一项
    pre: 上一项
    search: 搜索
    send: 发送
    default: ↵

preedit:
  horizontal_padding: 10
  top_start_radius: 8
  top_end_radius: 8
  foreground: {font_size: 15}

window:
  insets: {vertical: 5, horizontal: 6}
  item_padding: {vertical: 3, horizontal: 7}
  corner_radius: 10
  foreground: {label_font_size: 13, text_font_size: 17, comment_font_size: 12}

preset_color_schemes:
  default:
    name: 浅色
    dark_scheme: night
    light_scheme: default
    root_background: 0xF4F3F1
    back_color: 0xFAFAF8
    border_color: 0xD0CFCA
    candidate_background: 0xA6FFFFFF
    candidate_border_color: 0xD0CFCA
    candidate_text_color: 0x242527
    comment_text_color: 0x5A5B59
    hilited_candidate_back_color: 0xE7E6E1
    hilited_candidate_text_color: 0x353633
    hilited_comment_text_color: 0x42433F
    hilited_candidate_button_color: 0xD9D9D4
    keyboard_back_color: 0xF4F3F1
    glass_highlight: 0xFFFFFF
    glass_shade: 0xDEDCD7
    key_back_color: 0xD9FFFFFF
    key_border_color: 0xD0CFCA
    key_text_color: 0x242527
    key_symbol_color: 0x5A5B59
    hilited_key_back_color: 0xD9D9D4
    hilited_key_text_color: 0x242527
    text_color: 0x242527
    text_back_color: 0xF8F7F4
    liquid_keyboard_background: 0xF4F3F1
    action_back: 0xE3E2DE
    emphasis_back: 0xD8D7D2
    emphasis_text: 0x242527
    mode_back: 0xE7E6E1
    mode_text: 0x42433F
  night:
    name: 深色
    dark_scheme: night
    light_scheme: default
    root_background: 0x191A1C
    back_color: 0x2E2F30
    border_color: 0x4E5051
    candidate_background: 0xA6303133
    candidate_border_color: 0x4E5051
    candidate_text_color: 0xF4F3EF
    comment_text_color: 0xC4C3BF
    hilited_candidate_back_color: 0x424342
    hilited_candidate_text_color: 0xF4F3EF
    hilited_comment_text_color: 0xECE9E1
    hilited_candidate_button_color: 0x565756
    keyboard_back_color: 0x191A1C
    glass_highlight: 0x343638
    glass_shade: 0x1D1E20
    key_back_color: 0xDA38393B
    key_border_color: 0x535454
    key_text_color: 0xF4F3EF
    key_symbol_color: 0xC4C3BF
    hilited_key_back_color: 0x565755
    hilited_key_text_color: 0xF4F3EF
    text_color: 0xF4F3EF
    text_back_color: 0x323335
    liquid_keyboard_background: 0x191A1C
    action_back: 0x434444
    emphasis_back: 0xD8D7D2
    emphasis_text: 0x242527
    mode_back: 0x424342
    mode_text: 0xECE9E1

tool_bar:
  button_spacing: 4
  primary_button:
    action: Scheme_menu
    size: [86, 48]
    background: {normal: mode_back, highlight: hilited_candidate_button_color, corner_radius: 11, horizontal_inset: 5, vertical_inset: 6}
    foreground: {style: 切换方案, normal: mode_text, font_size: 13, padding: 4}
  buttons:
    - action: Link_clipboard
      size: [70, 48]
      background: {highlight: hilited_candidate_button_color, corner_radius: 10}
      foreground: {style: 剪贴板, font_size: 13}
    - action: Link_settings
      size: [62, 48]
      background: {highlight: hilited_candidate_button_color, corner_radius: 10}
      foreground: {style: 设置, font_size: 13}

preset_keys:
  Scheme_menu: {label: 切换方案, send: MENU}
  Link_settings: {label: 设置, send: SETTINGS}
  Link_clipboard: {label: 剪贴板, send: FUNCTION, command: clipboard_window, option: '0'}
  Number_board: {label: '123', send: Eisu_toggle, select: number}
  Letter_board: {label: 字母, send: Eisu_toggle, select: default}
  Language_mode: {toggle: ascii_mode, send: SWITCH_CHARSET, states: [中, 英]}
  Shift_L: {label: ⇧, send: Shift_L, shift_lock: ascii_long}
  BackSpace: {label: ⌫, repeatable: true, send: BackSpace}
  Space: {label: 空格, functional: false, send: space}
  Return: {label: enter_labels, send: Return}

preset_keyboards:
  default:
    name: 字母键盘
    label_transform: uppercase
    width: 10
    columns: 10
    ascii_mode: 0
    ascii_keyboard: default
    lock: true
    keys:
      - {click: q, long_click: '1'}
      - {click: w, long_click: '2'}
      - {click: e, long_click: '3'}
      - {click: r, long_click: '4'}
      - {click: t, long_click: '5'}
      - {click: y, long_click: '6'}
      - {click: u, long_click: '7'}
      - {click: i, long_click: '8'}
      - {click: o, long_click: '9'}
      - {click: p, long_click: '0'}
      - {width: 5}
      - {click: a, long_click: '-'}
      - {click: s, long_click: '/'}
      - {click: d, long_click: ':'}
      - {click: f, long_click: ';', swipe_up: ';'}
      - {click: g, long_click: '('}
      - {click: h, long_click: ')'}
      - {click: j, long_click: '~'}
      - {click: k, long_click: '“'}
      - {click: l, long_click: '”'}
      - {width: 5}
      - {click: Shift_L, width: 13.4, key_back_color: action_back}
      - {width: 1.6}
      - {click: z, long_click: '@'}
      - {click: x, long_click: '.'}
      - {click: c, long_click: '#'}
      - {click: v, long_click: '、'}
      - {click: b, long_click: '?'}
      - {click: n, long_click: '!'}
      - {click: m, long_click: '…'}
      - {width: 1.6}
      - {click: BackSpace, width: 13.4, key_back_color: action_back}
      - {click: Number_board, width: 20, key_back_color: action_back, key_text_size: 18}
      - {click: ',', long_click: '.', width: 10}
      - {click: Space, width: 38, key_text_size: 16}
      - {click: Language_mode, width: 11, key_back_color: mode_back, key_text_color: mode_text, key_text_size: 16}
      - {click: Return, width: 21, key_back_color: emphasis_back, key_text_color: emphasis_text, key_border_color: emphasis_back, key_text_size: 17}
  number:
    name: 数字与符号
    width: 10
    columns: 10
    ascii_mode: 1
    ascii_keyboard: number
    keys:
      - {click: '1'}
      - {click: '2'}
      - {click: '3'}
      - {click: '4'}
      - {click: '5'}
      - {click: '6'}
      - {click: '7'}
      - {click: '8'}
      - {click: '9'}
      - {click: '0'}
      - {click: '@'}
      - {click: '#'}
      - {click: '$'}
      - {click: '%'}
      - {click: '&'}
      - {click: '*'}
      - {click: '('}
      - {click: ')'}
      - {click: '-'}
      - {click: '+'}
      - {click: '!'}
      - {click: '?'}
      - {click: '/'}
      - {click: '_'}
      - {click: ':'}
      - {click: ';'}
      - {click: '='}
      - {click: "'", long_click: '"'}
      - {click: BackSpace, width: 20, key_back_color: action_back}
      - {click: Letter_board, width: 25, key_back_color: action_back, key_text_size: 14}
      - {click: ',', width: 10}
      - {click: Space, width: 37, key_text_size: 14}
      - {click: '.', width: 10}
      - {click: Return, width: 18, key_back_color: emphasis_back, key_text_color: emphasis_text, key_border_color: emphasis_back, key_text_size: 16}
